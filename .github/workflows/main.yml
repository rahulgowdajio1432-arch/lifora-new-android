
name: LIFORA Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Firebase OTP scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          html = p.read_text()
          sdk = '<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>\\n<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>\\n'
          if 'firebase-app-compat.js' not in html:
              html = html.replace('</head>', sdk + '</head>')
          auth = '<script src="firebase-auth.js"></script>\\n'
          if 'firebase-auth.js' not in html:
              html = html.replace('</body>', auth + '</body>')
          p.write_text(html)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/android@6.2.0

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFORA-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
