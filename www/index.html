
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>LIFORA - Your Life. Organized.</title>

<style>
:root{
  --gold:#d9b45b;
  --gold-light:#f5df9b;
  --bg:#080808;
  --card:#151515;
  --line:#333;
  --text:#f5f5f5;
  --muted:#aaa;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

header{
  padding:20px;
  border-bottom:1px solid #333;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  color:var(--gold);
  font-size:28px;
  font-weight:900;
  letter-spacing:3px;
}

.logo small{
  display:block;
  color:#aaa;
  font-size:10px;
  letter-spacing:3px;
  margin-top:5px;
}

main{
  max-width:1100px;
  margin:auto;
  padding:22px;
}

button,input,textarea{
  font:inherit;
}

button{cursor:pointer}

.gold-btn{
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  color:#111;
  border:0;
  padding:12px 18px;
  border-radius:9px;
  font-weight:bold;
}

.outline-btn{
  background:#191919;
  color:var(--gold);
  border:1px solid var(--gold);
  padding:10px 14px;
  border-radius:9px;
}

.welcome{margin:15px 0 25px}

.welcome h1{
  font-size:clamp(25px,5vw,36px);
  margin-bottom:8px;
}

.welcome h1 span{color:var(--gold)}

.welcome p{color:var(--muted)}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:13px;
  margin:22px 0;
}

.stat{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
}

.stat p{color:var(--muted);font-size:13px}

.stat h2{
  color:var(--gold);
  margin-top:9px;
  font-size:26px;
}

.section-heading{
  margin:28px 0 15px;
  color:var(--gold);
}

.modules{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:14px;
}

.module{
  text-align:left;
  background:linear-gradient(145deg,#1b1b1b,#101010);
  color:white;
  border:1px solid #333;
  border-radius:15px;
  padding:20px;
  min-height:125px;
}

.module:hover{border-color:var(--gold)}

.module .emoji{font-size:28px}

.module h3{
  font-size:15px;
  margin:12px 0 5px;
}

.module p{
  font-size:12px;
  color:var(--muted);
}

.panel{
  display:none;
  margin-top:25px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:20px;
}

.panel.active{display:block}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.panel-head h2{color:var(--gold)}

form{
  display:grid;
  gap:12px;
  margin:15px 0;
}

label{font-size:13px;color:#ccc}

input,textarea{
  width:100%;
  background:#090909;
  color:white;
  border:1px solid #444;
  padding:12px;
  border-radius:9px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.record{
  padding:14px;
  border:1px solid #333;
  border-radius:10px;
  margin:10px 0;
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.record small{
  color:var(--muted);
  display:block;
  margin-top:5px;
}

.delete-btn{
  background:#311919;
  color:#ffaaaa;
  border:1px solid #633;
  padding:7px 10px;
  border-radius:7px;
}

.empty{
  color:var(--muted);
  padding:20px 0;
}

footer{
  text-align:center;
  padding:25px;
  border-top:1px solid #333;
  color:#888;
  margin-top:40px;
  font-size:12px;
}

footer span{color:var(--gold)}

@media(max-width:500px){
  main{padding:15px}
  header{padding:15px}
}
</style>
</head>

<body>

<header>
  <div class="logo">
    LIFORA
    <small>YOUR LIFE. ORGANIZED.</small>
  </div>
</header>

<main>

<div class="welcome">
  <h1>Welcome to <span>LIFORA</span></h1>
  <p>Your personal life management dashboard.</p>
</div>

<div class="stats">
  <div class="stat">
    <p>Total Records</p>
    <h2 id="totalRecords">0</h2>
  </div>

  <div class="stat">
    <p>Total Expenses</p>
    <h2 id="totalExpenses">₹0</h2>
  </div>

  <div class="stat">
    <p>Active Reminders</p>
    <h2 id="totalReminders">0</h2>
  </div>
</div>

<h2 class="section-heading">My Organizer</h2>

<div class="modules">

<button class="module" data-module="documents">
  <div class="emoji">📄</div>
  <h3>Document Reminders</h3>
  <p>Manage important documents</p>
</button>

<button class="module" data-module="bills">
  <div class="emoji">💳</div>
  <h3>Bill Manager</h3>
  <p>Track your bills</p>
</button>

<button class="module" data-module="warranties">
  <div class="emoji">🛡️</div>
  <h3>Warranty Tracker</h3>
  <p>Track product warranties</p>
</button>

<button class="module" data-module="expenses">
  <div class="emoji">💰</div>
  <h3>Expense Tracker</h3>
  <p>Manage your spending</p>
</button>

<button class="module" data-module="reminders">
  <div class="emoji">⏰</div>
  <h3>Personal Reminders</h3>
  <p>Never forget a task</p>
</button>

<button class="module" data-module="family">
  <div class="emoji">👨‍👩‍👧</div>
  <h3>Family Organizer</h3>
  <p>Organize family details</p>
</button>

</div>

<div class="panel" id="panel">

  <div class="panel-head">
    <h2 id="panelTitle">Organizer</h2>
    <button class="outline-btn" id="backBtn">← Back</button>
  </div>

  <form id="recordForm">

    <label for="recordName">Name / Title</label>
    <input id="recordName" required maxlength="100"
           placeholder="Enter name or title">

    <label for="recordAmount">Amount (₹)</label>
    <input id="recordAmount" type="number" min="0" step="0.01"
           placeholder="Enter amount">

    <label for="recordDate">Date</label>
    <input id="recordDate" type="date">

    <label for="recordNotes">Additional Details</label>
    <textarea id="recordNotes" maxlength="500"
              placeholder="Enter additional details"></textarea>

    <button class="gold-btn" type="submit">Save Record</button>

  </form>

  <h3 class="section-heading">Saved Records</h3>

  <div id="recordsList"></div>

</div>

</main>

<footer>
  <span>LIFORA</span> — Your Life. Organized.
  <br><br>
  BY VR TECH SOLUTIONS
  <br>
  Premium Black & Gold
</footer>

<script>

const $ = id => document.getElementById(id);

const moduleNames = {
  documents:"Document Reminders",
  bills:"Bill Manager",
  warranties:"Warranty Tracker",
  expenses:"Expense Tracker",
  reminders:"Personal Reminders",
  family:"Family Organizer"
};

let currentModule = "";

let records = [];

try {
  records = JSON.parse(localStorage.getItem("lifora_records") || "[]");
  if (!Array.isArray(records)) records = [];
} catch(error) {
  records = [];
}

function saveData(){
  try {
    localStorage.setItem("lifora_records",JSON.stringify(records));
  } catch(error) {
    alert("Unable to save data on this device.");
  }
}

function updateDashboard(){

  $("totalRecords").textContent = records.length;

  const expenses = records
    .filter(r => r.module === "expenses")
    .reduce((sum,r) => sum + Number(r.amount || 0),0);

  $("totalExpenses").textContent =
    "₹" + expenses.toLocaleString("en-IN");

  $("totalReminders").textContent =
    records.filter(r =>
      ["documents","bills","reminders"].includes(r.module)
    ).length;
}

function openModule(module){

  currentModule = module;

  $("panelTitle").textContent = moduleNames[module];

  $("panel").classList.add("active");

  renderRecords();

  $("panel").scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
}

function renderRecords(){

  const list = $("recordsList");

  list.replaceChildren();

  const items = records.filter(r => r.module === currentModule);

  if(items.length === 0){

    const empty = document.createElement("p");

    empty.className = "empty";
    empty.textContent = "No records yet. Add your first record.";

    list.appendChild(empty);

    return;
  }

  items.forEach(record => {

    const box = document.createElement("div");
    box.className = "record";

    const info = document.createElement("div");

    const title = document.createElement("strong");
    title.textContent = record.name;

    info.appendChild(title);

    const details = document.createElement("small");

    details.textContent =
      (record.amount ? "₹" + record.amount + " | " : "") +
      (record.date || "") +
      (record.notes ? " | " + record.notes : "");

    info.appendChild(details);

    const del = document.createElement("button");

    del.className = "delete-btn";
    del.textContent = "Delete";

    del.onclick = () => {

      if(confirm("Are you sure you want to delete this record?")){

        records = records.filter(r => r.id !== record.id);

        saveData();
        renderRecords();
        updateDashboard();
      }
    };

    box.append(info,del);

    list.appendChild(box);
  });
}

$("recordForm").addEventListener("submit",function(e){

  e.preventDefault();

  const name = $("recordName").value.trim();

  if(!name){
    alert("Please enter a name or title.");
    return;
  }

  records.push({
    id:Date.now().toString(),
    module:currentModule,
    name:name,
    amount:$("recordAmount").value || "",
    date:$("recordDate").value || "",
    notes:$("recordNotes").value.trim()
  });

  saveData();

  this.reset();

  renderRecords();
  updateDashboard();

  alert("Record saved successfully!");
});

document.querySelectorAll(".module").forEach(button => {

  button.addEventListener("click",() => {

    openModule(button.dataset.module);

  });

});

$("backBtn").onclick = () => {

  $("panel").classList.remove("active");

};

updateDashboard();

</script>

</body>
</html>
